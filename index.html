<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <title>NuanceTEM - 专四专八近义词辨析</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfaf7" id="meta-theme-color" />
    <meta name="description" content="NuanceTEM 是一款为英语专业四级（TEM-4）和八级（TEM-8）备考设计的近义词辨析学习系统。采用 SM-2 智能记忆算法，提供完全离线的答题与错题复习曲线，帮助英专考生拿下词汇大关。" />
    <meta name="keywords" content="专四词汇,专八词汇,近义词辨析,英语专业四级,英语专业八级,TEM-4,TEM-8,记单词,SM-2,错题本" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (!theme && prefersDark) || (theme === 'system' && prefersDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', isDark ? '#090e1a' : '#fcfaf7');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
